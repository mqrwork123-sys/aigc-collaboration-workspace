<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>AIGC 课程定位图</title>
  <style>
    :root { --text:#1265a7; --soft:#dcedfb; --line:#9da9b3; --muted:#f2f7fb; --muted-text:#6c8599; --accent:#e05a3d; --accent-soft:#fff0eb; }
    * { box-sizing:border-box; }
    html,body { width:1920px; height:1080px; margin:0; background:transparent; font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif; }
    .diagram { position:relative; width:1920px; height:1080px; }
    svg { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
    path { fill:none; stroke:var(--line); stroke-width:2.5; marker-end:url(#arrow); }
    path.active { stroke:var(--text); stroke-width:3.4; }
    .node { position:absolute; display:flex; align-items:center; justify-content:center; min-height:112px; padding:18px 24px; border:2px solid #c5d9e8; border-radius:24px; background:var(--soft); color:var(--text); text-align:center; font-size:28px; font-weight:800; line-height:1.25; box-shadow:0 1px 2px rgba(18,101,167,.04); }
    .node small { display:block; margin-top:7px; font-size:17px; font-weight:600; line-height:1.35; }
    .root { left:755px; top:58px; width:410px; }
    .nlp { left:102px; top:300px; width:296px; }.cv { left:466px; top:300px; width:296px; }.model { left:830px; top:300px; width:296px; }.robot { left:1194px; top:300px; width:236px; }.science { left:1498px; top:300px; width:320px; }
    .dim { background:var(--muted); color:var(--muted-text); border-color:#d7e3ec; }
    .aigc { left:658px; top:560px; width:604px; min-height:132px; background:#eaf6ff; border-color:var(--text); }
    .course { left:508px; top:818px; width:904px; min-height:142px; background:var(--accent-soft); border-color:#ecaa98; color:var(--accent); }
    .legend { position:absolute; right:102px; bottom:76px; color:#70808c; font-size:17px; }
    .legend b { color:var(--text); }
  </style>
</head>
<body>
  <div class="diagram" aria-label="AIGC 影像创作课在人工智能框架中的位置">
    <svg viewBox="0 0 1920 1080" aria-hidden="true">
      <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="none" stroke="currentColor" stroke-width="1.7"/></marker></defs>
      <path d="M960 170 V238 H250 V300"/><path d="M960 170 V238 H614 V300"/><path d="M960 170 V238 H978 V300"/><path d="M960 170 V238 H1312 V300"/><path d="M960 170 V238 H1658 V300"/>
      <path class="active" d="M250 412 V496 H960 V560"/><path class="active" d="M614 412 V496 H960 V560"/><path class="active" d="M978 412 V560"/><path class="active" d="M960 692 V818"/>
    </svg>
    <div class="node root">人工智能 AI</div>
    <div class="node nlp">自然语言处理<br>NLP</div>
    <div class="node cv">计算机视觉<br>CV</div>
    <div class="node model">大模型 /<br>基础模型</div>
    <div class="node robot dim">机器人学</div>
    <div class="node science dim">AI for Science</div>
    <div class="node aigc">AIGC：生成内容的能力与应用<small>由语言、视觉与大模型共同支撑</small></div>
    <div class="node course">本课程：AIGC 影像创作课<small>聚焦文本、图像、视频、声音与 AI Skill 的创作应用</small></div>
    <div class="legend"><b>蓝色路径</b>＝课程的技术位置　·　灰色节点＝其他 AI 方向</div>
  </div>
</body>
</html>
